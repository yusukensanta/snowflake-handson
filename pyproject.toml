[project]
name = "snowflake-handson"
version = "0.1.0"
description = "Governed Snowflake pipeline tutorial: insurance and financing scenario"
requires-python = ">=3.11"
dependencies = ["snowflake-connector-python>=3.12", "pyyaml>=6"]

[project.optional-dependencies]
streaming = ["snowpipe-streaming>=1.9"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hanbit_gen", "src/sfops"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.uv]
package = true

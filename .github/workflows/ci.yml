name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ty check src
      - run: uv run pytest --cov --cov-fail-under=80

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: shellcheck
        run: find scripts tests -type f \( -perm -u+x -o -name "*.sh" \) -print0 | xargs -0 shellcheck
      - run: bash tests/test_check_secrets.sh

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - run: scripts/check-secrets

  terraform-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with: { terraform_version: 1.17.2, terraform_wrapper: false }
      - run: terraform -chdir=terraform fmt -check -recursive
      - name: validate (no backend, no credentials)
        run: |
          for d in terraform/envs/handson terraform/modules/aws_appendix; do
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
          done
